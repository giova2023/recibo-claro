<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
    <!-- Window Bar -->
    <rect width="1000" height="42" fill="#1e293b"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="500" y="26" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">ReciboClaro · giova2023.github.io/recibo-claro · Ejercicio 35 (3DS-A)</text>
    
    <!-- App Header -->
    <rect y="42" width="1000" height="70" fill="url(#gradHeader)"/>
    <defs>
      <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    </defs>
    <text x="32" y="85" fill="#ffffff" font-size="24" font-weight="bold">⚡ ReciboClaro</text>
    <text x="32" y="103" fill="#fef3c7" font-size="12">Calculadora de Consumo Eléctrico y Ahorro · Práctica 1 3DS-A</text>
    
    <!-- Rubric Badge -->
    <rect x="730" y="58" width="238" height="36" rx="18" fill="rgba(255,255,255,0.2)"/>
    <text x="849" y="81" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">EVIDENCIA 4 · VALIDACIÓN DE ERROR</text>
    
    <!-- Title banner -->
    <rect x="32" y="128" width="936" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="158" fill="#0f172a" font-size="18" font-weight="bold">E4: Validación Estricta de Horas Diarias (Bloqueo >24h)</text>
    <text x="50" y="174" fill="#64748b" font-size="12">Control de consistencia física: el día tiene 24 horas. Bloqueo automático ante entradas inválidas</text>
    
    <!-- Body Content -->
    
  <rect x="32" y="194" width="936" height="130" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="64" y="238" fill="#991b1b" font-size="20" font-weight="bold">⚠️ Error Bloqueante: Horas diarias no válidas</text>
  <text x="64" y="270" fill="#b91c1c" font-size="14">El día tiene un máximo de 24 horas. No puedes registrar un artefacto con 26.0 horas de uso por día.</text>
  <text x="64" y="296" fill="#7f1d1d" font-size="12" font-weight="600">Estado de la interfaz: El formulario desactiva el botón de guardar y resalta el campo en rojo.</text>
  
  <rect x="32" y="340" width="936" height="260" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="64" y="375" fill="#0f172a" font-size="16" font-weight="bold">Formulario de Edición de Artefacto</text>
  
  <text x="64" y="415" fill="#475569" font-size="12" font-weight="600">Nombre del Artefacto</text>
  <rect x="64" y="425" width="260" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="450" fill="#0f172a" font-size="13">Luz de Galpón Exterior</text>
  
  <text x="354" y="415" fill="#475569" font-size="12" font-weight="600">Potencia (Watts)</text>
  <rect x="354" y="425" width="160" height="38" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="366" y="450" fill="#0f172a" font-size="13">100 W</text>
  
  <text x="544" y="415" fill="#dc2626" font-size="12" font-weight="bold">Horas diarias (Máximo 24h) ❌</text>
  <rect x="544" y="425" width="180" height="38" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="556" y="450" fill="#dc2626" font-size="14" font-weight="bold">26.0</text>
  <text x="544" y="482" fill="#dc2626" font-size="11" font-weight="bold">⚠️ No puede superar 24 horas</text>
  
  <rect x="754" y="425" width="180" height="38" rx="6" fill="#e2e8f0"/>
  <text x="844" y="450" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="bold">Guardar (Bloqueado)</text>

  </svg>