  <text x="720" y="462" fill="#d97706" font-size="13" font-weight="bold">43.2 kWh</text>
  <text x="860" y="462" fill="#0f172a" font-size="13" font-weight="bold">$5.184</text>
  <line x1="52" y1="479" x2="948" y2="479" stroke="#f1f5f9"/>
  
  <text x="68" y="509" fill="#0f172a" font-size="13" font-weight="600">🖥️ Computadora Escritorio / Monitor</text>
