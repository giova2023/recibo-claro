  <text x="50" y="258" fill="#0f172a" font-size="28" font-weight="bold">12.24 <tspan font-size="14" fill="#64748b">kWh/día</tspan></text>
  
  <rect x="270" y="194" width="220" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="288" y="222" fill="#64748b" font-size="12" font-weight="600">CONSUMO MENSUAL</text>
  <text x="288" y="258" fill="#d97706" font-size="28" font-weight="bold">367.20 <tspan font-size="14" fill="#64748b">kWh/mes</tspan></text>
  
  <rect x="508" y="194" width="220" height="90" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="526" y="222" fill="#64748b" font-size="12" font-weight="600">CATEGORÍA TARIFARIA</text>
  <text x="526" y="258" fill="#0284c7" font-size="26" font-weight="bold">R3 <tspan font-size="13" fill="#64748b">(Residencial Medio)</tspan></text>
  
  <rect x="746" y="194" width="222" height="90" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="764" y="222" fill="#059669" font-size="12" font-weight="600">TOTAL FACTURA MENSUAL</text>
  <text x="764" y="258" fill="#059669" font-size="28" font-weight="bold">$44.180 <tspan font-size="13" fill="#047857">c/impuestos</tspan></text>
  
  <rect x="32" y="300" width="936" height="320" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="52" y="332" fill="#0f172a" font-size="15" font-weight="bold">Electrodomésticos en Uso</text>
  
  <rect x="52" y="350" width="896" height="36" fill="#f8fafc" rx="6"/>
