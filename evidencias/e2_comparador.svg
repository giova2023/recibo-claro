<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;">
    <!-- Window Bar -->
    <rect width="1000" height="42" fill="#1e293b"/>
    <circle cx="24" cy="21" r="6" fill="#ef4444"/>
    <circle cx="44" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="21" r="6" fill="#10b981"/>
    <text x="500" y="26" text-anchor="middle" fill="#94a3b8" font-size="13" font-weight="500">ReciboClaro · giova2023.github.io/recibo-claro · Ejercicio 35 (3DS-A)</text>
    
    <!-- App Header -->
    <rect y="42" width="1000" height="70" fill="url(#gradHeader)"/>
    <defs>
      <linearGradient id="gradHeader" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b"/>
        <stop offset="50%" stop-color="#d97706"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
    </defs>
    <text x="32" y="85" fill="#ffffff" font-size="24" font-weight="bold">⚡ ReciboClaro</text>
    <text x="32" y="103" fill="#fef3c7" font-size="12">Calculadora de Consumo Eléctrico y Ahorro · Práctica 1 3DS-A</text>
    
    <!-- Rubric Badge -->
    <rect x="730" y="58" width="238" height="36" rx="18" fill="rgba(255,255,255,0.2)"/>
    <text x="849" y="81" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">EVIDENCIA 2 · COMPARADOR</text>
    
    <!-- Title banner -->
    <rect x="32" y="128" width="936" height="50" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="50" y="158" fill="#0f172a" font-size="18" font-weight="bold">E2: Comparador de Escenarios (Antes vs. Después)</text>
    <text x="50" y="174" fill="#64748b" font-size="12">Simulación del impacto de eficiencia y reducción de horas de uso con métricas visuales</text>
    
    <!-- Body Content -->
    
  <rect x="32" y="194" width="450" height="230" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="32" y="194" width="450" height="38" rx="12" fill="#f1f5f9"/>
  <text x="52" y="218" fill="#475569" font-size="14" font-weight="bold">🔴 Escenario A: Consumo Actual (Antes)</text>
  
  <text x="52" y="260" fill="#64748b" font-size="12">Consumo mensual total:</text>
  <text x="52" y="292" fill="#0f172a" font-size="26" font-weight="bold">367.2 <tspan font-size="14" fill="#64748b">kWh/mes</tspan></text>
  <text x="52" y="325" fill="#64748b" font-size="12">Factura estimada mensual:</text>
  <text x="52" y="358" fill="#dc2626" font-size="28" font-weight="bold">$44.180</text>
  <text x="52" y="390" fill="#64748b" font-size="11">Categoría R3 · Aire 22°C (5h) · Lámparas halógenas</text>
  
  <rect x="518" y="194" width="450" height="230" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="2"/>
  <rect x="518" y="194" width="450" height="38" rx="12" fill="#ecfdf5"/>
  <text x="538" y="218" fill="#059669" font-size="14" font-weight="bold">🟢 Escenario B: Con Medidas de Ahorro (Después)</text>
  
  <text x="538" y="260" fill="#64748b" font-size="12">Consumo mensual optimizado:</text>
  <text x="538" y="292" fill="#059669" font-size="26" font-weight="bold">242.3 <tspan font-size="14" fill="#047857">kWh/mes (-34.0%)</tspan></text>
  <text x="538" y="325" fill="#64748b" font-size="12">Factura optimizada mensual:</text>
  <text x="538" y="358" fill="#059669" font-size="28" font-weight="bold">$29.150</text>
  <text x="538" y="390" fill="#047857" font-size="11">Categoría R2 · Aire 24°C (3.5h) · Iluminación 100% LED</text>
  
  <rect x="32" y="440" width="936" height="180" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="60" y="475" fill="#065f46" font-size="18" font-weight="bold">🎉 Resultado del Ahorro Estimado</text>
  <text x="60" y="515" fill="#047857" font-size="32" font-weight="bold">Ahorrás $15.030 por mes <tspan font-size="18" font-weight="normal">(equivalente a $180.360 al año)</tspan></text>
  <text x="60" y="550" fill="#065f46" font-size="14">Reducción de 124.9 kWh mensuales, bajando de categoría tarifaria y reduciendo la huella de carbono en 48 kg CO₂/mes.</text>

  </svg>